<!-- NOTA TEMPORAL PARA APRENDIZAJE: La misma tarjeta sirve al catálogo general y a Comida por orden; esta última usa una ruta que valida el menú publicado de hoy. Borra esta nota. -->
<article class="catalog-product-card" data-internal-product="{{ product.id }}" data-product-name="{{ product.name|lower }}">
  <div class="catalog-product-visual">{% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.name }}" style="--product-image-x:{{ product.image_position_x }}%;--product-image-y:{{ product.image_position_y }}%;--product-image-zoom:{{ product.image_zoom }}">{% endif %}</div>
  <div class="catalog-product-information"><strong>{{ product.name }}</strong><span>${{ product.price }}</span><div class="catalog-quick-controls"><button type="button" class="catalog-quantity-button" data-internal-decrease data-url="{% url 'orders:internal_order_product_decrease' order.id product.id %}" aria-label="Restar {{ product.name }}">−</button><strong data-internal-quantity>0</strong><form method="post" action="{% if daily_order %}{% url 'orders:internal_order_daily_product_add' order.id product.id %}{% else %}{% url 'orders:internal_order_product_add' order.id product.id %}{% endif %}" data-internal-add {% if daily_order and daily_menu and product.id == daily_menu.chicken_stew_id %}data-internal-chicken-choice{% endif %}>{% csrf_token %}{% if daily_order and daily_menu and product.id == daily_menu.chicken_stew_id %}<input type="hidden" name="chicken_piece" value="">{% endif %}<button type="submit" class="catalog-quantity-button">+</button></form></div><form method="post" action="{% if daily_order %}{% url 'orders:internal_order_daily_product_add' order.id product.id %}{% else %}{% url 'orders:internal_order_product_add' order.id product.id %}{% endif %}" data-internal-add data-customizable-product="{{ product.id }}" {% if daily_order and daily_menu and product.id == daily_menu.chicken_stew_id %}data-internal-chicken-choice{% endif %}>{% csrf_token %}{% if daily_order and daily_menu and product.id == daily_menu.chicken_stew_id %}<input type="hidden" name="chicken_piece" value="">{% endif %}<button type="submit" class="catalog-customize-button">Personalizar</button></form></div>
</article>
