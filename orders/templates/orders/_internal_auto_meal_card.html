<!-- NOTA TEMPORAL PARA APRENDIZAJE: Cada + ocupa un espacio del siguiente paquete incompleto; al reunir primero, segundo y tercero, Django los sustituye por una comida completa. Borra esta nota. -->
<article class="catalog-product-card" data-internal-auto-product="{{ product.id }}" data-product-name="{{ product.name|lower }}">
  <div class="catalog-product-visual">{% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.name }}" style="--product-image-x:{{ product.image_position_x }}%;--product-image-y:{{ product.image_position_y }}%;--product-image-zoom:{{ product.image_zoom }}">{% endif %}</div>
  <div class="catalog-product-information"><strong>{{ product.name }}</strong><span>${{ product.price }}</span><div class="catalog-quick-controls"><button type="button" class="catalog-quantity-button" data-internal-auto-decrease data-url="{% url 'orders:internal_order_auto_meal_decrease' order.id product.id %}" aria-label="Restar {{ product.name }}">−</button><strong data-internal-auto-quantity>0</strong><form method="post" action="{% url 'orders:internal_order_auto_meal_add' order.id product.id %}" data-internal-auto-add {% if product.id == daily_menu.chicken_stew_id %}data-internal-chicken-choice{% endif %}>{% csrf_token %}<input type="hidden" name="chicken_piece" value=""><button type="submit" class="catalog-quantity-button" aria-label="Agregar {{ product.name }}">+</button></form></div><form method="post" action="{% url 'orders:internal_order_auto_meal_add' order.id product.id %}" data-internal-auto-add data-customizable-product="{{ product.id }}" {% if product.id == daily_menu.chicken_stew_id %}data-internal-chicken-choice{% endif %}>{% csrf_token %}<input type="hidden" name="chicken_piece" value=""><button type="submit" class="catalog-customize-button">Personalizar</button></form></div>
</article>
