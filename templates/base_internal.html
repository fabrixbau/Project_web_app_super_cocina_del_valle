<!-- NOTA TEMPORAL PARA APRENDIZAJE:
La barra interna muestra el acceso y contador de notificaciones solo a roles autorizados.
Borra esta nota después de comprobarlo. -->
<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Super Cocina del Valle{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="topbar">
    <strong>Super Cocina del Valle</strong>
    {% if user.is_authenticated %}
      {% if can_view_notifications %}<a class="notification-link" href="{% url 'notifications:notification_list' %}">Notificaciones{% if unread_notification_count %}<span>{{ unread_notification_count }}</span>{% endif %}</a>{% endif %}
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Cerrar sesión</button></form>
    {% endif %}
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
</body>
</html>
