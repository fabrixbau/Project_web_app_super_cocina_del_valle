<!-- NOTA TEMPORAL PARA APRENDIZAJE: Esta tarjeta sigue construyendo paquetes automáticos, pero ofrece menos, más y comentario como el resto del catálogo. Borra esta nota. -->
<article class="catalog-product-card" data-catalog-product="{{ product.id }}" data-auto-meal-card data-product-name="{{ product.name }}">
  <div class="catalog-product-visual">{% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.name }}">{% endif %}</div>
  <div class="catalog-product-information"><strong>{{ product.name }}</strong><span>${{ product.price }}</span>
    <div class="catalog-quick-controls"><button type="button" class="catalog-quantity-button" data-catalog-decrease data-url="{% url 'tables:table_auto_meal_decrease' account.id product.id %}" aria-label="Restar {{ product.name }}">−</button><strong data-standard-quantity>0</strong><form method="post" action="{% url 'tables:table_auto_meal_add' account.id product.id %}" data-product-add {% if product.id == daily_menu.chicken_stew_id %}data-chicken-choice{% endif %}>{% csrf_token %}{% if product.id == daily_menu.chicken_stew_id %}<input type="hidden" name="chicken_piece" value="">{% endif %}<button type="submit" class="catalog-quantity-button" aria-label="Agregar {{ product.name }}">+</button></form></div>
    <form class="catalog-customize-form" method="post" action="{% url 'tables:table_auto_meal_add' account.id product.id %}" data-product-add data-customizable-product="{{ product.id }}" {% if product.id == daily_menu.chicken_stew_id %}data-chicken-choice{% endif %}>{% csrf_token %}{% if product.id == daily_menu.chicken_stew_id %}<input type="hidden" name="chicken_piece" value="">{% endif %}<button type="submit" class="catalog-customize-button">Personalizar</button></form>
  </div>
</article>
