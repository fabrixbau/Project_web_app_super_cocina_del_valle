{# Una categoría del menú público: título y la lista de productos (fila con foto). #}
<section class="pp-section pp-category" id="pp-cat-{{ category.id }}">
  <h2>{{ category.name }}</h2>
  <div class="pp-product-list">
    {% for product in category.available_products %}{% include "menu/_public_product_card.html" with product=product %}{% endfor %}
  </div>
</section>
