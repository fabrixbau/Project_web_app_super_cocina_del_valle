<section class="public-category-area"><h2>{{ title }}</h2><nav class="public-category-tabs" data-public-tabs="{{ catalog_id }}">{% for category in food_categories %}<button type="button" data-public-category="{{ catalog_id }}-{{ category.id }}"{% if forloop.first %} class="is-selected"{% endif %}>{{ category.name }}</button>{% endfor %}</nav>{% for category in food_categories %}<section class="public-category-panel" data-public-panel="{{ catalog_id }}-{{ category.id }}"{% if not forloop.first %} hidden{% endif %}><h2>{{ category.name }}</h2><div class="table-product-grid">{% for product in category.available_products %}{% include "menu/_public_product_card.html" with product=product %}{% endfor %}</div></section>{% endfor %}</section>
